{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Мой сайт{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .tutor-photo {
      width: 250px;
      height: 250px;
      object-fit: cover;
      display: block;
    }
    .tutor-photo-sm {
      width: 100%;
      height: 250px;
      object-fit: cover;
      display: block;
    }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'tutors:list' %}">Преподаватели</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="{% url 'tutors:list' %}">Преподаватели</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'tutors:list' %}">Предметы</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'tutors:list' %}">Отзывы</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container">
  {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
